<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="설비 소프트웨어 장치 추상화 구조 다이어그램">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" fill="#7d8590">

    <!-- 1. 애플리케이션 -->
    <rect x="40" y="16" width="800" height="62" rx="8" fill="none" stroke="#7d8590" stroke-width="1.4"/>
    <text x="60" y="42" font-size="15" font-weight="600">설비 애플리케이션</text>
    <text x="60" y="62" font-size="12">WPF · Avalonia (MVVM) — 장치 구현을 알지 못한다. 계약만 참조한다.</text>

    <path d="M440 78 L440 108" stroke="#7d8590" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

    <!-- 2. 추상화 계층 -->
    <rect x="40" y="110" width="800" height="128" rx="8" fill="none" stroke="#7d8590" stroke-width="1.4"/>
    <text x="60" y="136" font-size="15" font-weight="600">장치 추상화 계층</text>

    <rect x="60" y="150" width="176" height="30" rx="6" fill="none" stroke="#7d8590" stroke-width="1" stroke-opacity="0.6"/>
    <text x="148" y="170" font-size="12" font-weight="500" text-anchor="middle">Abstractions — 포트</text>
    <rect x="248" y="150" width="176" height="30" rx="6" fill="none" stroke="#7d8590" stroke-width="1" stroke-opacity="0.6"/>
    <text x="336" y="170" font-size="12" font-weight="500" text-anchor="middle">Factories — 선택·주입</text>
    <rect x="436" y="150" width="176" height="30" rx="6" fill="none" stroke="#7d8590" stroke-width="1" stroke-opacity="0.6"/>
    <text x="524" y="170" font-size="12" font-weight="500" text-anchor="middle">Options — 설정</text>
    <rect x="624" y="150" width="196" height="30" rx="6" fill="none" stroke="#7d8590" stroke-width="1" stroke-opacity="0.6"/>
    <text x="722" y="170" font-size="12" font-weight="500" text-anchor="middle">Runtime — 폴링·재연결</text>

    <text x="60" y="206" font-size="12">Camera · PLC · Printer · RFID · Scanner · Light · Modbus · Motion · HTTP · Tool</text>
    <text x="60" y="226" font-size="12">장치군 10종에 같은 형태를 적용해, 새 장치는 어댑터 하나만 더한다.</text>

    <path d="M236 238 L236 268" stroke="#7d8590" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <path d="M644 238 L644 268" stroke="#7d8590" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

    <!-- 3-1. 실장치 어댑터 -->
    <rect x="40" y="270" width="392" height="150" rx="8" fill="none" stroke="#7d8590" stroke-width="1.4"/>
    <text x="60" y="296" font-size="15" font-weight="600">실장치 어댑터</text>
    <text x="60" y="322" font-size="12.5">MC 프로토콜 — Mitsubishi PLC</text>
    <text x="60" y="344" font-size="12.5">Modbus/TCP — 모션 제어기</text>
    <text x="60" y="366" font-size="12.5">GigE 카메라 · Cognex VisionPro</text>
    <text x="60" y="388" font-size="12.5">ZPL/SGD 라벨 프린터 · 스캐너 · RFID · 조명</text>
    <text x="60" y="410" font-size="12">현장에서 실제로 도는 것</text>

    <!-- 3-2. 가상 어댑터 -->
    <rect x="448" y="270" width="392" height="150" rx="8" fill="none" stroke="#3fb950" stroke-width="1.4"/>
    <text x="468" y="296" font-size="15" font-weight="600" fill="#3fb950">가상 어댑터</text>
    <text x="468" y="322" font-size="12.5" fill="#3fb950">가상 PLC — 시퀀스를 메모리에서 재현</text>
    <text x="468" y="344" font-size="12.5" fill="#3fb950">가상 카메라 — 저장된 영상으로 검사 재생</text>
    <text x="468" y="366" font-size="12.5" fill="#3fb950">Unity 설비 시뮬레이터 — 기구 동작 확인</text>
    <text x="468" y="388" font-size="12.5" fill="#3fb950">가상 프린터 · 스캐너</text>
    <text x="468" y="410" font-size="12">설비 없이 같은 코드를 돌리는 것</text>

    <!-- 캡션 -->
    <text x="440" y="452" font-size="12.5" text-anchor="middle">같은 계약 뒤에서 실장치와 가상 장치를 바꿔 끼운다 — 현장 장비 없이 개발하고, 회귀 테스트를 자동화한다.</text>

  </g>
</svg>
